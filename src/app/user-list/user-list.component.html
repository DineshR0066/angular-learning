<div class="container">
  <h1>Users</h1>

  <div class="search-bar">
    <input 
      type="text" 
      [ngModel]="searchTerm()" 
      (ngModelChange)="searchTerm.set($event)"
      placeholder="Search users..."
    >
  </div>

  <div class="list-container">
    @for (user of filteredUsers(); track user.id) {
      <div class="user-card">
        <div class="user-info">
          <h3>{{ user.name }}</h3>
          <p>{{ user.email }} - <span class="role-badge">{{ user.role }}</span></p>
        </div>
      </div>
    } @empty {
      <p>No users found.</p>
    }
  </div>
</div>
